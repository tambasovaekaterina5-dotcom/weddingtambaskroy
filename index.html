<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitly — Цифровые приглашения на свадьбу</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .title { font-family: 'Playfair Display', serif; }
        .inv-card { box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto p-4">

    <!-- NAV -->
    <nav class="flex justify-between items-center py-6 border-b border-white/10">
        <div class="flex items-center gap-3">
            <span class="text-4xl">💍</span>
            <h1 class="text-3xl title tracking-tight">Invitly</h1>
        </div>
        <div class="flex gap-6 text-sm">
            <a href="#" onclick="navigate('home')" class="hover:text-rose-400">Главная</a>
            <a href="#" onclick="navigate('editor')" class="hover:text-rose-400">Создать</a>
            <a href="#" onclick="navigate('guests')" class="hover:text-rose-400">Гости</a>
        </div>
    </nav>

    <!-- HOME -->
    <div id="home" class="pt-20 text-center">
        <h2 class="text-6xl title leading-tight mb-6">Создайте волшебное<br>приглашение за 5 минут</h2>
        <button onclick="navigate('editor')" 
                class="bg-rose-600 hover:bg-rose-700 text-xl px-12 py-6 rounded-3xl mt-8 transition">
            Начать создание приглашения →
        </button>
    </div>

    <!-- EDITOR -->
    <div id="editor" class="hidden pt-10">
        <div class="grid md:grid-cols-2 gap-10">
            <!-- Preview -->
            <div>
                <h3 class="text-2xl mb-4 title">Предпросмотр</h3>
                <div id="preview" class="inv-card bg-white text-black rounded-3xl overflow-hidden mx-auto max-w-md">
                    <div id="preview-bg" class="h-96 bg-cover bg-center relative">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/30 to-black/70"></div>
                    </div>
                    <div class="p-8 text-center">
                        <div id="preview-names" class="title text-5xl mb-4"></div>
                        <div id="preview-date" class="text-xl"></div>
                        <div id="preview-venue" class="text-lg mt-1"></div>
                        <p id="preview-message" class="mt-8 italic"></p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-8">
                <div class="bg-zinc-900 rounded-3xl p-8">
                    <h4 class="uppercase tracking-widest text-xs mb-4 text-white/60">Данные свадьбы</h4>
                    <input id="names" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4" placeholder="Анна & Дмитрий" oninput="updatePreview()">
                    <input id="date" class="w-full bg-zinc-800 rounded-2xl px-5 py-4 mb-4" placeholder="15 августа 2026" oninput="updatePreview()">
                    <input id="venue" class="w-full bg-zinc-800 rounded-2xl px-5 py-4" placeholder="Ресторан Золотой Сад" oninput="updatePreview()">
                    <textarea id="message" rows="3" class="w-full bg-zinc-800 rounded-3xl px-5 py-4 mt-4" oninput="updatePreview()">Дорогие друзья и родные...</textarea>
                </div>

                <div class="bg-zinc-900 rounded-3xl p-8">
                    <h4 class="uppercase tracking-widest text-xs mb-4 text-white/60">Дизайн</h4>
                    <input type="file" id="bg-upload" accept="image/*" class="hidden" onchange="uploadBackground(event)">
                    <button onclick="document.getElementById('bg-upload').click()" 
                            class="w-full border border-dashed border-white/30 py-6 rounded-3xl hover:border-rose-400 transition">
                        📸 Загрузить свой фон
                    </button>
                </div>

                <div class="bg-zinc-900 rounded-3xl p-8">
                    <h4 class="uppercase tracking-widest text-xs mb-3 text-white/60">Фоновая музыка</h4>
                    <input id="music-url" type="text" placeholder="https://... (прямая ссылка на mp3)" 
                           class="w-full bg-zinc-800 rounded-2xl px-5 py-4">
                    <button onclick="saveMusic()" class="mt-3 text-sm bg-white/10 px-6 py-2 rounded-2xl">Применить музыку</button>
                </div>

                <button onclick="saveTemplate()" 
                        class="w-full bg-gradient-to-r from-rose-500 to-purple-600 py-7 rounded-3xl text-xl font-medium">
                    Сохранить и перейти к гостям →
                </button>
            </div>
        </div>
    </div>

    <!-- GUESTS -->
    <div id="guests" class="hidden pt-10">
        <div class="flex justify-between mb-8">
            <h2 class="text-4xl title">Список гостей</h2>
            <button onclick="addGuest()" class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-2xl flex items-center gap-2">
                <i class="fas fa-plus"></i> Добавить гостя
            </button>
        </div>

        <div id="guests-list" class="space-y-4"></div>
    </div>
</div>

<!-- INVITATION PAGE (для открытия по ссылке) -->
<div id="invitation-page" class="hidden min-h-screen bg-black flex items-center justify-center p-4">
    <div class="max-w-md w-full inv-card bg-white text-black rounded-3xl overflow-hidden">
        <div id="inv-bg" class="h-96 bg-cover bg-center relative"></div>
        <div class="p-10 text-center">
            <div id="inv-names" class="title text-6xl leading-none mb-6"></div>
            <div id="inv-date" class="text-2xl mb-2"></div>
            <div id="inv-venue" class="text-xl"></div>
            <p id="inv-message" class="mt-10 italic text-lg"></p>

            <div class="mt-12">
                <button onclick="submitRSVP()" 
                        class="w-full bg-rose-600 text-white py-5 rounded-2xl text-lg">
                    Подтвердить участие
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== STATE ====================
let template = {
    names: "Анна & Дмитрий",
    date: "15 августа 2026",
    venue: "Ресторан «Золотой Сад», Москва",
    message: "Дорогие друзья! Приглашаем вас разделить с нами самый важный день...",
    bg: "https://picsum.photos/id/1015/800/1200",
    music: ""
};

let guests = JSON.parse(localStorage.getItem('weddingGuests')) || [];

// ==================== NAV ====================
function navigate(page) {
    document.querySelectorAll('#home, #editor, #guests, #invitation-page').forEach(el => el.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    
    if (page === 'guests') renderGuests();
}

// ==================== EDITOR ====================
function updatePreview() {
    template.names = document.getElementById('names').value || template.names;
    template.date = document.getElementById('date').value || template.date;
    template.venue = document.getElementById('venue').value || template.venue;
    template.message = document.getElementById('message').value || template.message;

    document.getElementById('preview-names').textContent = template.names;
    document.getElementById('preview-date').textContent = template.date;
    document.getElementById('preview-venue').textContent = template.venue;
    document.getElementById('preview-message').textContent = template.message;
}

function uploadBackground(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            template.bg = ev.target.result;
            document.getElementById('preview-bg').style.backgroundImage = `url(${template.bg})`;
        };
        reader.readAsDataURL(file);
    }
}

function saveMusic() {
    template.music = document.getElementById('music-url').value.trim();
    alert('Музыка сохранена! Она будет играть на приглашении.');
}

function saveTemplate() {
    localStorage.setItem('weddingTemplate', JSON.stringify(template));
    alert('Шаблон сохранён!');
    navigate('guests');
}

// ==================== GUESTS ====================
function renderGuests() {
    const container = document.getElementById('guests-list');
    container.innerHTML = '';

    guests.forEach((guest, i) => {
        const div = document.createElement('div');
        div.className = "bg-zinc-900 rounded-3xl p-6 flex justify-between items-center";
        div.innerHTML = `
            <div>
                <div class="font-medium">${guest.name}</div>
                ${guest.rsvp ? `<span class="text-emerald-400 text-sm">✓ ${guest.rsvp}</span>` : ''}
            </div>
            <div class="flex gap-3">
                <button onclick="showQR(${i})" class="px-5 py-2 bg-white/10 rounded-2xl text-sm">QR</button>
                <button onclick="copyLink(${i})" class="px-5 py-2 bg-rose-600 rounded-2xl text-sm">Скопировать ссылку</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function addGuest() {
    const name = prompt("Введите имя гостя:");
    if (!name) return;
    
    guests.push({ name, rsvp: null });
    localStorage.setItem('weddingGuests', JSON.stringify(guests));
    renderGuests();
}

function copyLink(index) {
    const guest = guests[index];
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?id=${index}`;
    
    navigator.clipboard.writeText(link);
    alert(`Ссылка скопирована:\n${link}`);
}

// ==================== QR ====================
function showQR(index) {
    const guest = guests[index];
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?id=${index}`;
    
    const qrContainer = document.createElement('div');
    qrContainer.innerHTML = `<div id="qr" class="mx-auto"></div>`;
    qrContainer.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:20px;z-index:1000;';
    
    document.body.appendChild(qrContainer);
    
    new QRCode(document.getElementById("qr"), {
        text: link,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff"
    });
    
    qrContainer.onclick = () => qrContainer.remove();
}

// ==================== INVITATION PAGE ====================
function loadInvitation() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if (id !== null) {
        document.getElementById('home').classList.add('hidden');
        document.getElementById('editor').classList.add('hidden');
        document.getElementById('guests').classList.add('hidden');
        const page = document.getElementById('invitation-page');
        page.classList.remove('hidden');

        const savedTemplate = JSON.parse(localStorage.getItem('weddingTemplate')) || template;
        
        document.getElementById('inv-bg').style.backgroundImage = `url(${savedTemplate.bg})`;
        document.getElementById('inv-names').textContent = savedTemplate.names;
        document.getElementById('inv-date').textContent = savedTemplate.date;
        document.getElementById('inv-venue').textContent = savedTemplate.venue;
        document.getElementById('inv-message').textContent = savedTemplate.message;

        // Музыка
        if (savedTemplate.music) {
            const audio = new Audio(savedTemplate.music);
            audio.loop = true;
            audio.volume = 0.4;
            audio.play().catch(() => {});
        }
    }
}

function submitRSVP() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (id === null) return;

    const answer = prompt("Вы придёте? (Да / Нет / Может быть)", "Да");
    if (answer) {
        guests[id].rsvp = answer;
        localStorage.setItem('weddingGuests', JSON.stringify(guests));
        alert("Спасибо! Ваш ответ сохранён ❤️");
    }
}

// ==================== INIT ====================
window.onload = () => {
    // Загружаем сохранённый шаблон
    const saved = localStorage.getItem('weddingTemplate');
    if (saved) template = JSON.parse(saved);

    // Проверяем, открыта ли ссылка-приглашение
    loadInvitation();

    // Инициализация Tailwind
    updatePreview();
};
</script>
</body>
</html>
